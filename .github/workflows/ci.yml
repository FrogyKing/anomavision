name: AnomaVision CI Quality Gates

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  UV_LINK_MODE: copy
  PYTHONUTF8: "1"
  GRADIO_ANALYTICS_ENABLED: "False"

jobs:
  quality-and-tests:
    name: Lint, Typecheck, Reproducibility & Unit/Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Secret-safety and repository hygiene check
        run: |
          uv run python -c "
          import subprocess, sys
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          forbidden_ext = ('.safetensors', '.pt', '.pth', '.tar.xz', '.tar.gz')
          bad_files = [f for f in tracked if f.endswith(forbidden_ext) or f.startswith('.env')]
          assert not bad_files, f'Forbidden binary or env files tracked in git: {bad_files}'
          print(f'Verified {len(tracked)} tracked files are clean of secrets and raw checkpoints.')
          "

      - name: Run Ruff linter
        run: uv run ruff check src tests

      - name: Run Mypy static type checker
        run: uv run mypy src tests

      - name: Verify deterministic configuration fingerprint and DVC lineage
        run: |
          uv run python -c "
          from pathlib import Path
          import yaml
          from anomavision.config import PipelineConfig
          cfg = PipelineConfig.from_yaml(Path('configs/default.yaml'))
          assert len(cfg.fingerprint()) == 16
          dvc = yaml.safe_load(Path('dvc.yaml').read_text(encoding='utf-8'))
          assert 'run_modal_pipeline' in dvc['stages']
          print('Deterministic fingerprint verified:', cfg.fingerprint())
          "

      - name: Run unit and integration test suite (CPU synthetic fixtures)
        run: uv run pytest -m "not gpu" --cov=anomavision --cov-report=term-missing

  container-build:
    name: Validate Production Container Build
    runs-on: ubuntu-latest
    needs: quality-and-tests
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space for PyTorch CUDA layers
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Build production Docker image
        run: docker build -t anomavision:ci-test .

      - name: Smoke-test CLI and FastAPI factory inside container
        run: |
          docker run --rm anomavision:ci-test python -c "
          import anomavision
          from anomavision.api.app import create_app
          print('Container verified AnomaVision version:', anomavision.__version__)
          "
