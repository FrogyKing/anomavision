[project]
name = "anomavision"
version = "1.0.0"
description = "Production-grade visual anomaly intelligence using DINOv3 dense patch representations, greedy k-center coresets, FAISS similarity retrieval, and SAM 3 object masking."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Luis Gonzalez", email = "luisgonzalezalvarez991@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0.0",
    "faiss-cpu>=1.9.0",
    "fastapi>=0.115.0",
    "gradio>=5.0.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.26.0",
    "matplotlib>=3.9.0",
    "mlflow>=2.17.0",
    "modal>=1.6.2",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "prometheus-client>=0.21.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "safetensors>=0.4.5",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=5.0.0",
    "typer>=0.12.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
anomavision = "anomavision.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "B008", "N812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "gpu: marks tests requiring GPU execution on Modal",
    "integration: marks integration tests across pipeline and API",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
